name: Sync articles to Blogger

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes to Blogger (false previews the plan)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blogger-production
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Always reconcile the newest main, even if an older push was queued.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify local export and synchronization tests
        run: |
          python -B -m unittest discover -s scripts -p test_blogger_sync.py
          python -B scripts/blogger_sync.py --export-only
      - name: Restore cooldown checkpoint
        id: checkpoint
        uses: actions/cache/restore@v5
        with:
          path: .blogger/state.json
          key: blogger-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: blogger-state-
      - name: Reconcile Blogger slowly
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          if [ "$APPLY" = 'true' ]; then
            python -B scripts/blogger_sync.py --apply
          else
            python -B scripts/blogger_sync.py
          fi
      - name: Save checkpoint even after an API limit error
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .blogger/state.json
          key: blogger-state-${{ github.run_id }}-${{ github.run_attempt }}
